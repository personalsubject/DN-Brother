<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>একটি বিশেষ সারপ্রাইজ ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow: hidden;
  font-family: "Noto Sans Bengali", sans-serif;
  background: radial-gradient(circle at top, #4a102e, #160719 65%, #08040e);
  color: white;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 20% 30%, white 50%, transparent),
    radial-gradient(2px 2px at 70% 20%, #ffc0dc 50%, transparent),
    radial-gradient(2px 2px at 40% 80%, white 50%, transparent),
    radial-gradient(2px 2px at 85% 65%, #ff80b5 50%, transparent);
  background-size: 180px 180px;
  animation: starsMove 12s linear infinite;
}

@keyframes starsMove {
  from { transform: translateY(0); }
  to { transform: translateY(-180px); }
}

.center {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  text-align: center;
  position: relative;
  z-index: 2;
}

.card {
  width: 100%;
  max-width: 480px;
  padding: 34px 22px;
  border: 1px solid rgba(255, 180, 215, .35);
  border-radius: 28px;
  background: rgba(255, 255, 255, .07);
  backdrop-filter: blur(12px);
  box-shadow: 0 0 35px rgba(255, 40, 130, .18);
  animation: appear 1.2s ease both;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(25px) scale(.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.heart {
  font-size: 58px;
  display: inline-block;
  filter: drop-shadow(0 0 15px #ff438f);
  animation: heartbeat 1.2s infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.18); }
  30% { transform: scale(1); }
  45% { transform: scale(1.12); }
}

h1 {
  font-size: clamp(25px, 7vw, 37px);
  margin: 16px 0;
  color: #ffd3e6;
  text-shadow: 0 0 16px #ff348b;
}

.message {
  min-height: 95px;
  font-size: 18px;
  line-height: 1.9;
  color: #fff0f6;
  margin: 18px 0;
}

button {
  border: none;
  border-radius: 50px;
  padding: 13px 25px;
  margin: 7px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  color: #74113d;
  background: linear-gradient(135deg, #ffe0ec, #ff82b5);
  box-shadow: 0 5px 20px rgba(255, 66, 145, .28);
  transition: transform .2s, box-shadow .2s;
}

button:active {
  transform: scale(.94);
}

button:hover {
  box-shadow: 0 0 25px rgba(255, 120, 180, .6);
}

.hidden {
  display: none;
}

.name {
  font-size: clamp(32px, 9vw, 49px);
  font-weight: bold;
  color: #ffb7d7;
  text-shadow: 0 0 8px #ff5aa5, 0 0 25px #ff268c;
  overflow-wrap: anywhere;
  animation: nameGlow 1.6s ease-in-out infinite alternate;
}

@keyframes nameGlow {
  from { transform: scale(.97); text-shadow: 0 0 8px #ff5aa5; }
  to { transform: scale(1.04); text-shadow: 0 0 25px #ff268c, 0 0 45px #ff80bd; }
}

.float {
  position: fixed;
  bottom: -40px;
  z-index: 1;
  pointer-events: none;
  animation: floatUp linear forwards;
}

@keyframes floatUp {
  to {
    transform: translateY(-115vh) rotate(360deg);
    opacity: 0;
  }
}

#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}

.small {
  font-size: 12px;
  color: #e9bbd0;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="stars"></div>
<canvas id="confetti"></canvas>

<div class="center">
  <main class="card">
    <div class="heart">💗</div>

    <section id="intro">
      <h1>তোমার জন্য একটি সারপ্রাইজ</h1>
      <p class="message">
        কিছু কথা আছে হৃদয়ের গভীরে…<br>
        আজ সেগুলো তোমাকে বলতে চাই। ❤️
      </p>
      <button id="startBtn">সারপ্রাইজ দেখো 💌</button>
    </section>

    <section id="story" class="hidden">
      <h1 id="heading">একটা কথা বলি…</h1>
      <p class="message" id="message"></p>
      <button id="nextBtn">এরপর কী? 💕</button>
    </section>

    <section id="ending" class="hidden">
      <h1>আমার বিশেষ মানুষ ❤️</h1>
      <div class="name" id="personName"></div>
      <p class="message">
        তোমার হাসি সুন্দর থাকুক,<br>
        তোমার প্রতিটি দিন আনন্দে ভরে উঠুক। 🌹
      </p>
      <div class="heart">❤️</div>
      <button id="againBtn">আবার দেখো ✨</button>
    </section>

    <p class="small">তৈরি করা হয়েছে হৃদয়ের একটুখানি ভালোবাসা দিয়ে 💖</p>
  </main>
</div>

<script>
"use strict";

// এখানে নিজের পছন্দমতো নাম পরিবর্তন করো
const CONFIG = {
  name: "খাদিজা",
  messages: [
    "তোমাকে কিছু বলার জন্য এই ছোট্ট সারপ্রাইজটি তৈরি করেছি। 💌",
    "পৃথিবীতে অনেক সুন্দর মুহূর্ত আছে, আর কিছু মুহূর্ত মনে বিশেষ জায়গা করে নেয়। 🌸",
    "তোমার জন্য রইল অনেক শুভকামনা, হাসি আর সুন্দর দিনের প্রার্থনা। 💗",
    "এবার তোমার জন্য রাখা শেষ সারপ্রাইজটি দেখো… ❤️"
  ]
};

const $ = id => document.getElementById(id);

let step = 0;
let audioContext = null;
let melodyTimer = null;
let typingTimer = null;

function playTone(frequency, duration = 0.22) {
  if (!audioContext) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";
  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.08, audioContext.currentTime + 0.03
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001, audioContext.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + duration + 0.04);
}

function playMelody() {
  if (!audioContext) return;

  [523, 659, 784, 659].forEach((frequency, index) => {
    setTimeout(() => playTone(frequency, 0.3), index * 450);
  });
}

function startMusic() {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    if (!audioContext) {
      audioContext = new AudioContextClass();
    }

    audioContext.resume();
    playMelody();

    clearInterval(melodyTimer);
    melodyTimer = setInterval(playMelody, 2200);
  } catch (error) {
    console.log("অডিও চালু করা যায়নি:", error);
  }
}

function typeText(element, text, speed = 38) {
  clearInterval(typingTimer);
  element.textContent = "";
  let index = 0;

  typingTimer = setInterval(() => {
    element.textContent += text.charAt(index);
    index++;

    if (index >= text.length) {
      clearInterval(typingTimer);
    }
  }, speed);
}

function showSection(sectionId) {
  ["intro", "story", "ending"].forEach(id => {
    $(id).classList.toggle("hidden", id !== sectionId);
  });
}

function createFloatingHeart() {
  const item = document.createElement("span");
  const symbols = ["💗", "💖", "💕", "✨", "🌸", "❤️"];

  item.className = "float";
  item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
  item.style.left = Math.random() * 100 + "vw";
  item.style.fontSize = (16 + Math.random() * 22) + "px";
  item.style.animationDuration = (5 + Math.random() * 5) + "s";

  document.body.appendChild(item);
  setTimeout(() => item.remove(), 10500);
}

setInterval(createFloatingHeart, 650);

const canvas = $("confetti");
const ctx = canvas.getContext("2d");
let particles = [];
let animationFrame = null;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function celebrate() {
  particles = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: -Math.random() * canvas.height,
    size: 3 + Math.random() * 5,
    speed: 2 + Math.random() * 4,
    drift: (Math.random() - 0.5) * 3,
    hue: Math.random() * 360
  }));

  if (animationFrame) cancelAnimationFrame(animationFrame);

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.y += p.speed;
      p.x += p.drift;

      ctx.fillStyle = `hsl(${p.hue}, 90%, 70%)`;
      ctx.fillRect(p.x, p.y, p.size, p.size * 1.6);

      if (p.y > canvas.height) {
        p.y = -10;
        p.x = Math.random() * canvas.width;
      }
    });

    animationFrame = requestAnimationFrame(draw);
  }

  draw();

  setTimeout(() => {
    if (animationFrame) cancelAnimationFrame(animationFrame);
    animationFrame = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }, 5000);
}

$("startBtn").addEventListener("click", () => {
  startMusic();
  step = 0;
  showSection("story");
  typeText($("message"), CONFIG.messages[step]);
});

$("nextBtn").addEventListener("click", () => {
  startMusic();
  step++;

  if (step < CONFIG.messages.length) {
    typeText($("message"), CONFIG.messages[step]);
  } else {
    clearInterval(typingTimer);
    showSection("ending");
    $("personName").textContent = CONFIG.name;
    celebrate();
    playMelody();
  }
});

$("againBtn").addEventListener("click", () => {
  step = 0;
  clearInterval(typingTimer);
  showSection("intro");
  startMusic();
});

window.addEventListener("pagehide", () => {
  clearInterval(melodyTimer);
  clearInterval(typingTimer);
  if (animationFrame) cancelAnimationFrame(animationFrame);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Surprise</title>
    <style>
        /* CSS RESET & GENERAL STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* SCREEN 1: GET STARTED (SADA PAGE & KALO BUTTON) */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .btn-get-started {
            background-color: #000000;
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            padding: 16px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-get-started:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        /* SCREEN 2: LOADING SCREEN */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0d11;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s;
            color: #ffffff;
        }

        .heart-loader {
            font-size: 50px;
            animation: pulse 1s infinite alternate;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.3); }
        }

        .progress-container {
            width: 250px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4b2b, #ff416c);
            transition: width 0.1s linear;
        }

        .loading-text {
            font-size: 16px;
            color: #cccccc;
            letter-spacing: 1px;
        }

        /* SCREEN 3: MAIN ANIMATION CONTENT */
        #main-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0d0d1a 0%, #1a001a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 8;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 1s;
        }

        /* CANVAS FOR PARTICLE BACKGROUND */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* FLOATING DOLLS & TEDDY BEARS */
        .floating-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .float-item {
            position: absolute;
            font-size: 35px;
            animation: floatUp 8s infinite linear;
            opacity: 0.8;
            cursor: pointer;
            pointer-events: auto;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* TEXT CONTENT CARDS */
        .content-box {
            position: relative;
            z-index: 3;
            text-align: center;
            color: #ffffff;
            padding: 20px;
            max-width: 90%;
        }

        .cartoon-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .message-text {
            font-size: 26px;
            font-weight: 500;
            color: #ffe6f0;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            min-height: 80px;
        }

        .message-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* GRAND FINALE TITLE */
        .love-title {
            font-size: 55px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff0055, #ff5088, #ff80bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
            margin-bottom: 10px;
            display: none;
            animation: zoomIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .name-title {
            font-size: 45px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 20px #ff3399, 0 0 40px #ff0066;
            display: none;
            animation: fadeInName 1.2s ease forwards;
        }

        @keyframes zoomIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeInName {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: GET STARTED -->
    <div id="start-screen">
        <button class="btn-get-started" id="btn-start">Get Started</button>
    </div>

    <!-- SCREEN 2: LOADING -->
    <div id="loading-screen">
        <div class="heart-loader">💖</div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="loading-text" id="loading-text">Loading 0%</div>
    </div>

    <!-- SCREEN 3: MAIN ANIMATION -->
    <div id="main-screen">
        <canvas id="canvas"></canvas>
        <div class="floating-container" id="floating-container"></div>

        <div class="content-box">
            <div class="cartoon-icon" id="cartoon-icon">🧸</div>
            <div class="message-text" id="message-text"></div>
            <div class="love-title" id="love-title">I Love You!</div>
            <div class="name-title" id="name-title"></div>
        </div>
    </div>

    <script>
        /****************************************************************
         * ⚙️ CONFIGURATION: আপনি চাইলে এখানে নাম ও মেসেজ পরিবর্তন করতে পারেন
         ****************************************************************/
        const CONFIG = {
            // আই লাভ ইউ লেখার পর যে নাম আসবে:
            personName: "খাদিজা", 
            
            // এনিমেশনে ধাপে ধাপে যেসব কার্টুন আইকন ও লেখা আসবে:
            steps: [
                { icon: "🧸", text: "তোমার জন্য ছোট্ট একটা মিষ্টি সারপ্রাইজ..." },
                { icon: "🐰", text: "প্রতিটি মুহূর্ত তোমাকে মনে পড়ে..." },
                { icon: "🌸", text: "তুমি আমার জীবনের সবথেকে সুন্দর অনুভূতি..." },
                { icon: "🎁", text: "সবসময় এরকম মিষ্টি হাসি নিয়ে থেকো..." }
            ],
            
            // ভাসমান পুতুল/আইকনসমূহ:
            floatingItems: ["🧸", "🎎", "🐱", "🦄", "💖", "🌸", "✨", "🎈"]
        };

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const mainScreen = document.getElementById('main-screen');
        const btnStart = document.getElementById('btn-start');
        const progressBar = document.getElementById('progress-bar');
        const loadingText = document.getElementById('loading-text');
        
        const cartoonIcon = document.getElementById('cartoon-icon');
        const messageText = document.getElementById('message-text');
        const loveTitle = document.getElementById('love-title');
        const nameTitle = document.getElementById('name-title');
        const floatingContainer = document.getElementById('floating-container');

        // AUDIO EFFECTS (Synthesized Web Audio API - No External Files Needed)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(freq, duration) {
            try {
                if(!audioCtx) audioCtx = new AudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // EVENT: START BUTTON CLICK
        btnStart.addEventListener('click', () => {
            playSound(523.25, 0.3); // Play subtle click sound
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.visibility = 'hidden';
                loadingScreen.style.visibility = 'visible';
                loadingScreen.style.opacity = '1';
                startLoadingSequence();
            }, 800);
        });

        // LOADING SEQUENCE
        function startLoadingSequence() {
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 5) + 2;
                if (progress > 100) progress = 100;
                
                progressBar.style.width = progress + '%';
                loadingText.innerText = `Loading ${progress}%`;

                if (progress === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loadingScreen.style.opacity = '0';
                        setTimeout(() => {
                            loadingScreen.style.visibility = 'hidden';
                            mainScreen.style.visibility = 'visible';
                            mainScreen.style.opacity = '1';
                            initMainAnimation();
                        }, 800);
                    }, 500);
                }
            }, 80);
        }

        // MAIN ANIMATION SEQUENCE
        function initMainAnimation() {
            initParticles();
            createFloatingItems();

            let currentStep = 0;

            function showNextStep() {
                if (currentStep < CONFIG.steps.length) {
                    const step = CONFIG.steps[currentStep];
                    
                    // Fade out current text
                    messageText.classList.remove('active');
                    
                    setTimeout(() => {
                        cartoonIcon.innerText = step.icon;
                        messageText.innerText = step.text;
                        messageText.classList.add('active');
                        playSound(440 + (currentStep * 50), 0.4);
                        currentStep++;
                        setTimeout(showNextStep, 3500);
                    }, 800);
                } else {
                    // FINAL SURPRISE SHOWDOWN
                    setTimeout(() => {
                        cartoonIcon.style.display = 'none';
                        messageText.style.display = 'none';

                        // Show "I Love You!"
                        loveTitle.style.display = 'block';
                        playSound(659.25, 0.6);

                        // Show Person Name after "I Love You!"
                        setTimeout(() => {
                            nameTitle.innerText = "💖 " + CONFIG.personName + " 💖";
                            nameTitle.style.display = 'block';
                            playSound(783.99, 0.8);
                            triggerHeartExplosion();
                        }, 1200);

                    }, 1000);
                }
            }

            showNextStep();
        }

        // CREATE FLOATING DOLLS / TEDDY BEARS
        function createFloatingItems() {
            setInterval(() => {
                const item = document.createElement('div');
                item.className = 'float-item';
                const randomIcon = CONFIG.floatingItems[Math.floor(Math.random() * CONFIG.floatingItems.length)];
                item.innerText = randomIcon;
                
                item.style.left = Math.random() * 90 + 5 + 'vw';
                item.style.animationDuration = (Math.random() * 4 + 6) + 's';
                
                item.addEventListener('click', () => {
                    playSound(880, 0.2);
                    item.style.transform = 'scale(1.8)';
                    item.style.opacity = '0';
                    setTimeout(() => item.remove(), 300);
                });

                floatingContainer.appendChild(item);

                // Auto remove after animation ends
                setTimeout(() => {
                    if(item.parentNode) item.remove();
                }, 10000);
            }, 1000);
        }

        // BACKGROUND CANVAS PARTICLES
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * -1 - 0.5;
                this.color = `hsla(${Math.random() * 60 + 330}, 100%, 75%, ${Math.random() * 0.7 + 0.3})`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }
            animateParticles();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        function triggerHeartExplosion() {
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle());
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY STORAGE HUB - AI Edition</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Personal Cyberpunk AI Cloud Storage Hub on GitHub Pages.">
    <meta name="keywords" content="Storage Hub, GitHub Pages, AI Theme, File Manager">
    <meta name="author" content="DN Brother">
    
    <!-- Google Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <!-- Auth Box (Password Protected Login) -->
    <div id="auth-box" class="auth-box">
        <div class="auth-header">
            <i class="fa-solid fa-lock"></i>
            <h2>MY STORAGE HUB</h2>
            <p>সিকিউর পার্সোনাল ক্লাউড পোর্টাল</p>
        </div>
        <div class="auth-form">
            <input type="password" id="auth-password" placeholder="অ্যাক্সেস পাসওয়ার্ড লিখুন">
            <div class="auth-btns">
                <button class="btn primary" onclick="appAuth()"><i class="fa-solid fa-key"></i> আনলক করুন</button>
            </div>
        </div>
    </div> 

    <!-- Main App Portal -->
    <div id="app-box" class="app-box" style="display: none;">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-brain"></i>
                <span>STORAGE HUB</span>
            </div>
            <nav class="nav-links">
                <button class="nav-btn active" onclick="switchTab('dashboard')"><i class="fa-solid fa-chart-pie"></i> ড্যাশবোর্ড</button>
                <button class="nav-btn" onclick="switchTab('all')"><i class="fa-solid fa-layer-group"></i> All Files</button>
                <button class="nav-btn" onclick="switchTab('photos')"><i class="fa-solid fa-image"></i> Photos</button>
                <button class="nav-btn" onclick="switchTab('videos')"><i class="fa-solid fa-video"></i> Videos</button>
                <button class="nav-btn" onclick="switchTab('music')"><i class="fa-solid fa-music"></i> Music</button>
                <button class="nav-btn" onclick="switchTab('pdf')"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                <button class="nav-btn" onclick="switchTab('other')"><i class="fa-solid fa-microchip"></i> Other Files</button>
            </nav>
            <button class="btn logout-btn" onclick="logout()"><i class="fa-solid fa-power-off"></i> সাইনআউট</button>
        </aside>

        <!-- Content Console -->
        <main class="main-content">
            
            <header class="top-header">
                <h2 id="section-title">ড্যাশবোর্ড</h2>
                <div class="user-profile">
                    <span id="user-display-email">Personal Admin Portal</span>
                </div>
            </header>

            <!-- Overview Dashboard -->
            <div id="dashboard-view" class="view-section">
                <div class="stats-grid">
                    <div class="stat-card blue">
                        <i class="fa-solid fa-hard-drive"></i>
                        <div><h3 id="cnt-total">০</h3><p>মোট ফাইল</p></div>
                    </div>
                    <div class="stat-card green">
                        <i class="fa-solid fa-camera-retro"></i>
                        <div><h3 id="cnt-photos">০</h3><p>Photos</p></div>
                    </div>
                    <div class="stat-card red">
                        <i class="fa-solid fa-film"></i>
                        <div><h3 id="cnt-videos">০</h3><p>Videos</p></div>
                    </div>
                    <div class="stat-card purple">
                        <i class="fa-solid fa-compact-disc"></i>
                        <div><h3 id="cnt-music">০</h3><p>Music</p></div>
                    </div>
                    <div class="stat-card orange">
                        <i class="fa-solid fa-file-lines"></i>
                        <div><h3 id="cnt-pdf">০</h3><p>PDF</p></div>
                    </div>
                    <div class="stat-card grey">
                        <i class="fa-solid fa-server"></i>
                        <div><h3 id="cnt-size">0 KB</h3><p>স্টোরেজ সাইজ</p></div>
                    </div>
                </div>
            </div>

            <!-- AI Drag and Drop Upload -->
            <section class="upload-section">
                <div class="drop-zone" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                    <p>ফাইল নির্বাচন বা আপলোড করতে এখানে ট্যাপ করুন</p>
                    <small>ছবি, ভিডিও, অডিও, PDF এবং অন্যান্য যেকোনো ফাইল সাপোর্ট করবে</small>
                    <input type="file" id="file-input" multiple onchange="handleFileUpload(event)" style="display:none;">
                </div>
            </section>

            <!-- Actions Bar -->
            <section class="action-bar">
                <div class="selection-controls">
                    <button class="btn secondary" onclick="selectAllFiles()"><i class="fa-solid fa-square-check"></i> Select All</button>
                    <button class="btn secondary" onclick="clearSelection()"><i class="fa-solid fa-square"></i> Clear Selection</button>
                    <span id="selected-count">০ টি ফাইল সিলেক্টেড</span>
                </div>
                <button class="btn primary" onclick="downloadSelected()"><i class="fa-solid fa-download"></i> Download Selected</button>
            </section>

            <!-- File Display Grid -->
            <section id="file-grid" class="file-grid"></section>

        </main>
    </div>

    <!-- Media Preview Modal -->
    <div id="preview-modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
